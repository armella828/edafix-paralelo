services:
  master:
    build: .
    container_name: edafix-master
    hostname: master
    volumes:
      - ../:/workspace
    networks:
      edafix-net:
        ipv4_address: 172.25.0.10
  worker1:
    build: .
    container_name: edafix-worker1
    hostname: worker1
    volumes:
      - ../:/workspace
    networks:
      edafix-net:
        ipv4_address: 172.25.0.11
  worker2:
    build: .
    container_name: edafix-worker2
    hostname: worker2
    volumes:
      - ../:/workspace
    networks:
      edafix-net:
        ipv4_address: 172.25.0.12
networks:
  edafix-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24
